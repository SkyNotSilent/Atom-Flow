name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  RUN_REAL_SECURITY_TESTS: "false"
  RUN_REAL_WRITE_AGENT_TESTS: "false"
  RUN_REAL_CANVAS_TESTS: "false"
  RUN_REAL_BILLING_TESTS: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://atomflow_test:atomflow_test@127.0.0.1:5432/atomflow_migration_test
      RUN_REAL_MIGRATION_TESTS: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atomflow_test
          POSTGRES_PASSWORD: atomflow_test
          POSTGRES_DB: atomflow_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atomflow_test -d atomflow_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:migrations
      - run: npm run test:rss:cache
      - run: npm run test:rss:soak
      - run: npm run build
